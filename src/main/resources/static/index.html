<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slop Tweet Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg1: #fff5fb;
            --bg2: #fffaf0;
            --accent: #ff7ab6;
            --accent-2: #ffd1e8;
            --muted: #6b6b6b;
            --card: #ffffffcc;
            --glass: rgba(255,255,255,0.7);
            --shadow: 0 6px 18px rgba(155,100,150,0.15);
            --radius: 14px;
        }
        html,body{height:100%;margin:0;font-family:"Poppins", "Josefin Sans", sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#332a3a}
        .wrap{max-width:1100px;margin:28px auto;padding:24px;display:grid;grid-template-columns:1fr 360px;gap:20px}
        header{grid-column: 1/-1;display:flex;align-items:center;justify-content:space-between}
        h1{margin:0;font-weight:600;color:#4a2039;letter-spacing:0.4px}
        .sub{color:var(--muted);font-size:14px}
        .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;backdrop-filter: blur(6px)}
        form .row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
        textarea{width:100%;height:110px;border-radius:10px;border:1px solid #f1d8ea;padding:12px;font-size:15px;resize:vertical;background:transparent}
        input[type="text"]{width:100%;padding:10px;border-radius:10px;border:1px solid #f1d8ea;background:transparent}
        label.opt{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer}
        .opts{display:flex;gap:8px}
        input[type="radio"]{display:none}
        input[type="radio"]:checked + .optInner{background:linear-gradient(90deg,#fff,#fff);border:1px solid var(--accent);box-shadow:0 6px 12px rgba(255,120,175,0.12)}
        .optInner{padding:8px 10px;border-radius:8px;border:1px solid #ffeef6;background:linear-gradient(180deg,#fff,#fff)}
        .btn{
            background:linear-gradient(90deg,var(--accent),#ff9ad6);
            color:white;border:none;padding:12px 18px;border-radius:12px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(255,122,170,0.18);
            transition:transform .14s ease;
        }
        .btn:active{transform:translateY(2px)}
        .flex{display:flex;gap:12px;align-items:center}
        .history-item{padding:10px;border-radius:10px;border:1px dashed #ffdff2;background:linear-gradient(180deg,rgba(255,250,253,0.6),rgba(255,245,250,0.4));cursor:pointer;display:flex;justify-content:space-between;align-items:center}
        .history-item:hover{transform:translateX(6px);transition:transform .12s}
        .badge{background:var(--accent);color:white;padding:6px 10px;border-radius:999px;font-weight:600;font-size:13px}
        .result{margin-top:12px}
        .variant{padding:12px;border-radius:10px;background:linear-gradient(180deg,#fff,#fff9);border:1px solid #fde8f6;margin-bottom:8px}
        .voice{font-weight:700;color:#6a1f48;margin-bottom:6px}
        .small{font-size:13px;color:var(--muted)}
        /* Spinner & Loader */
        .overlay{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,250,253,0.6);backdrop-filter:blur(3px);z-index:120;pointer-events:none;opacity:0;transition:opacity .18s}
        .overlay.show{opacity:1;pointer-events:auto}
        .spinner{width:120px;height:120px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;animation:spin 1.1s linear infinite}
        .spinner:before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:conic-gradient(#fff0,#ff7ab6 10%,#ffd1e8 40%,#fff0);filter:blur(8px);opacity:.95}
        .spinnerInner{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#fff,#ffeef8);display:flex;align-items:center;justify-content:center;font-weight:700;color:#ff4980;box-shadow:0 8px 20px rgba(255,100,170,0.12)}
        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        /* Decorative animated flowers/hearts */
        .floaters{position:absolute;left:0;top:0;width:100%;height:60px;pointer-events:none;overflow:hidden}
        .floater{position:absolute;opacity:.9}
        .heart{width:22px;height:22px;background:radial-gradient(circle at 30% 35%, #fff, #ffcce6);border-radius:50%;transform:rotate(-45deg);box-shadow:0 6px 16px rgba(200,80,140,0.12)}
        .flower{width:14px;height:14px;border-radius:50%;background:linear-gradient(90deg,#ffd1e8,#fff0);box-shadow:0 4px 10px rgba(255,150,200,0.12)}
        .floater.ani1{animation:floaty 6s infinite ease-in-out}
        .floater.ani2{animation:floaty 7.5s infinite ease-in-out}
        @keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(14px)}100%{transform:translateY(0)}}
        /* fireworks canvas */
        #fw{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:200}
        /* small responsive */
        @media (max-width:980px){.wrap{grid-template-columns:1fr; padding:18px}header{flex-direction:column;gap:12px}}
        /* annoying blinking accent on header */
        .fancyTitle{display:inline-block;padding:.2rem .6rem;border-radius:999px;background:linear-gradient(90deg,#fff,#ffeefb);animation:blink 2.2s infinite}
        @keyframes blink{0%{box-shadow:0 0 0 rgba(255,122,170,0)}50%{box-shadow:0 6px 22px rgba(255,122,170,0.18)}100%{box-shadow:0 0 0 rgba(255,122,170,0)}}
    </style>
</head>
<body>
<div class="floaters" aria-hidden="true">
    <div class="floater ani1" style="left:6%;top:6%"><div class="heart"></div></div>
    <div class="floater ani2" style="left:28%;top:8%"><div class="flower"></div></div>
    <div class="floater ani1" style="left:70%;top:10%"><div class="heart" style="width:18px;height:18px"></div></div>
</div>

<canvas id="fw"></canvas>
<div class="overlay" id="overlay" aria-hidden="true">
    <div class="spinner" role="status" aria-live="polite">
        <div class="spinnerInner">LLM</div>
    </div>
</div>

<div class="wrap">
    <header>
        <div>
            <h1><span class="fancyTitle">Slop</span> Tweet Converter</h1>
            <div class="sub">Turn your raw thoughts into playful tweets — modernized & sparkled ✨</div>
        </div>
        <div class="small">Tip: history is saved locally in your browser</div>
    </header>

    <div class="card">
        <form id="tweetForm">
            <div style="margin-bottom:8px" class="small">Original Tweet</div>
            <textarea id="orig" placeholder="Type your tweet...">How to learn to code fast</textarea>

            <div class="row">
                <div style="flex:1">
                    <div class="small">Topic hint</div>
                    <input id="topic" type="text" value="Spring AI">
                </div>
                <div style="width:200px">
                    <div class="small">Emoji level</div>
                    <div class="opts" id="emojiOpts">
                        <label class="opt"><input type="radio" name="emoji" value="low"><span class="optInner">Low</span></label>
                        <label class="opt"><input type="radio" name="emoji" value="medium"><span class="optInner">Medium</span></label>
                        <label class="opt"><input type="radio" name="emoji" value="high" checked><span class="optInner">High</span></label>
                    </div>
                </div>
            </div>

            <div style="margin-bottom:12px">
                <div class="small">Modernization level</div>
                <div class="opts" id="modOpts">
                    <label class="opt"><input type="radio" name="mod" value="low"><span class="optInner">Low</span></label>
                    <label class="opt"><input type="radio" name="mod" value="medium"><span class="optInner">Medium</span></label>
                    <label class="opt"><input type="radio" name="mod" value="extreme" checked><span class="optInner">Extreme</span></label>
                </div>
            </div>

            <div class="flex" style="justify-content:space-between">
                <div class="small" id="status">Ready</div>
                <div style="display:flex;gap:8px">
                    <button type="button" class="btn" id="submitBtn">Convert</button>
                    <button type="button" class="btn" id="clearHistory" style="background:linear-gradient(90deg,#ffb6d8,#fff5fb);color:#6a1f48">Clear</button>
                </div>
            </div>

            <div class="result" id="resultArea" aria-live="polite"></div>
        </form>
    </div>

    <aside class="card" style="height:470px;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0">History</h3>
            <div class="small">Click to view variants</div>
        </div>
        <div id="historyList" style="overflow:auto;flex:1;display:grid;gap:8px"></div>
    </aside>
</div>

<script>
    // localStorage key
    const LS_KEY = 'slop_tweet_history_v1';

    function $(id){return document.getElementById(id)}
    function getSelected(name){
        const r = document.querySelector('input[name="'+name+'"]:checked');
        return r ? r.value : null;
    }

    function loadHistory(){
        try{
            const raw = localStorage.getItem(LS_KEY);
            return raw ? JSON.parse(raw) : [];
        }catch(e){ return [] }
    }
    function saveHistory(arr){
        localStorage.setItem(LS_KEY, JSON.stringify(arr));
        renderHistory();
    }

    function renderHistory(){
        const list = $('historyList');
        list.innerHTML = '';
        const hist = loadHistory().slice().reverse(); // newest first
        if(hist.length === 0){
            list.innerHTML = '<div class="small" style="color:#a45a85">No history yet — try converting a tweet!</div>';
            return;
        }
        hist.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'history-item';
            el.innerHTML = `
          <div style="flex:1">
            <div style="font-weight:700;color:#4a2039">${escapeHtml(item.orignalTweet).slice(0,60)}${item.orignalTweet.length>60 ? '…' : ''}</div>
            <div class="small">topic: ${escapeHtml(item.topicHint)} · emojis: ${item.emojiLevel} · modernize: ${item.modernizationLevel}</div>
          </div>
          <div style="margin-left:10px"><div class="badge">${new Date(item.ts).toLocaleTimeString()}</div></div>
        `;
            el.addEventListener('click', ()=> showHistoryItem(item));
            list.appendChild(el);
        });
    }

    function escapeHtml(s){
        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function setStatus(s){
        $('status').textContent = s;
    }

    function showOverlay(show){
        const ov = $('overlay');
        if(show) ov.classList.add('show'); else ov.classList.remove('show');
    }

    function renderVariants(variants){
        const area = $('resultArea');
        area.innerHTML = '';
        if(!variants || variants.length===0){
            area.innerHTML = '<div class="small">No variants returned.</div>';
            return;
        }
        variants.forEach(v=>{
            const node = document.createElement('div');
            node.className = 'variant';
            const voice = (v.voice || v.Voice || v.voiceName || 'VOICE').toString();
            node.innerHTML = `<div class="voice">${escapeHtml(voice)}</div><div>${escapeHtml(v.tweet || v.tweetText || v.text || v)}</div>`;
            area.appendChild(node);
        });
    }

    function showHistoryItem(item){
        // show stored variants if available
        if(item.response && item.response.length){
            renderVariants(item.response);
        } else {
            $('resultArea').innerHTML = '<div class="small">No saved response for this entry.</div>';
        }
        setStatus('Viewing history item');
    }

    async function submit(){
        const orignalTweet = $('orig').value.trim() || 'How to learn to code fast';
        const emojiLevel = getSelected('emoji') || 'high';
        const topicHint = $('topic').value.trim() || 'Spring AI';
        const modernizationLevel = getSelected('mod') || 'extreme';

        const params = new URLSearchParams({
            orignalTweet, emojiLevel, topicHint, modernizationLevel
        });

        setStatus('Querying LLM… this may take a while ✨');
        showOverlay(true);
        startSpinnerBudge();

        try{
            const res = await fetch('/tweets?' + params.toString(), { method: 'GET', headers:{'Accept':'application/json'} });
            if(!res.ok) throw new Error('Server returned ' + res.status);
            const data = await res.json();

            // Normalize response to an array of variants
            let variants = [];
            if(Array.isArray(data)) {
                // maybe server returned array directly
                variants = data;
            } else if(data.tweets && Array.isArray(data.tweets)) {
                variants = data.tweets;
            } else if(data.tweet && data.voice){
                // single item
                variants = [data];
            } else if(typeof data === 'object') {
                // try to map values
                // maybe structure: {tweets: [{tweet:..., voice:...}]}
                for(const k of ['tweets','variants']) {
                    if(data[k] && Array.isArray(data[k])) { variants = data[k]; break; }
                }
                if(variants.length===0){
                    // try to collect fields
                    for(const v of Object.values(data)){
                        if(v && typeof v.tweet === 'string') variants.push(v);
                    }
                }
            }

            renderVariants(variants);

            // Save to history
            const hist = loadHistory();
            hist.push({
                ts: Date.now(),
                orignalTweet, emojiLevel, topicHint, modernizationLevel,
                response: variants
            });
            saveHistory(hist);

            setStatus('Done — saved to local history ✨');
            triggerFireworks();
        }catch(err){
            console.error(err);
            setStatus('Error: ' + (err.message || 'unknown'));
            $('resultArea').innerHTML = `<div class="small" style="color:#a34a6a">Error contacting server: ${escapeHtml(err.message || String(err))}</div>`;
        }finally{
            showOverlay(false);
            stopSpinnerBudge();
        }
    }

    // spinner pulsing support (extra animation)
    let spinnerInterval;
    function startSpinnerBudge(){
        const s = document.querySelector('.spinnerInner');
        if(!s) return;
        let f = 1;
        spinnerInterval = setInterval(()=> {
            s.style.transform = `scale(${1 + 0.03*Math.sin(Date.now()/120)})`;
        },80);
    }
    function stopSpinnerBudge(){ clearInterval(spinnerInterval); spinnerInterval = null; }

    // Fireworks effect (simple)
    const fwCanvas = $('fw');
    const fwCtx = fwCanvas.getContext ? fwCanvas.getContext('2d') : null;
    let fwW, fwH, fwParticles = [], fwRunning = false;

    function resizeCanvas(){
        fwCanvas.width = window.innerWidth;
        fwCanvas.height = window.innerHeight;
        fwW = fwCanvas.width; fwH = fwCanvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerFireworks(){
        if(!fwCtx) return;
        // create a bunch of fireworks at random positions near top-middle
        for(let i=0;i<12;i++){
            const px = fwW*0.2 + Math.random()*fwW*0.6;
            const py = 120 + Math.random()*200;
            createBurst(px, py);
        }
        if(!fwRunning) animateFW();
    }

    function createBurst(x,y){
        const colors = ['#ff5da2','#ffd1e8','#ffd700','#ff8ab1','#b19cd9','#ffe08a'];
        const count = 20 + Math.floor(Math.random()*40);
        for(let i=0;i<count;i++){
            const angle = Math.random()*Math.PI*2;
            const speed = 1 + Math.random()*6;
            fwParticles.push({
                x,y,
                vx: Math.cos(angle)*speed,
                vy: Math.sin(angle)*speed,
                life: 60 + Math.floor(Math.random()*40),
                col: colors[Math.floor(Math.random()*colors.length)],
                size: 1 + Math.random()*3
            });
        }
    }

    function animateFW(){
        fwRunning = true;
        const t = window.setInterval(()=>{
            fwCtx.clearRect(0,0,fwW,fwH);
            for(let i = fwParticles.length -1; i>=0; i--){
                const p = fwParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06; // gravity
                p.life--;
                fwCtx.fillStyle = p.col;
                fwCtx.globalAlpha = Math.max(0, p.life/80);
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                fwCtx.fill();
                if(p.life<=0 || p.y>fwH+20) fwParticles.splice(i,1);
            }
            if(fwParticles.length===0){
                window.clearInterval(t);
                fwCtx.clearRect(0,0,fwW,fwH);
                fwRunning = false;
            }
        }, 1000/60);
    }

    // initial wiring
    document.addEventListener('DOMContentLoaded', ()=>{
        renderHistory();
        $('submitBtn').addEventListener('click', submit);
        $('clearHistory').addEventListener('click', ()=>{
            if(confirm('Clear all saved history?')) { localStorage.removeItem(LS_KEY); renderHistory(); $('resultArea').innerHTML=''; setStatus('History cleared'); }
        });

        // make radio labels clickable to check
        document.querySelectorAll('.opt').forEach(el=>{
            el.addEventListener('click', e=>{
                const r = el.querySelector('input[type=radio]');
                if(r) r.checked = true;
                // trigger re-render of styles
                document.querySelectorAll('input[name="'+r.name+'"]').forEach(i=> {
                    if(i.checked) i.parentElement.querySelector('.optInner').style.borderColor = 'var(--accent)';
                    else i.parentElement.querySelector('.optInner').style.borderColor = 'transparent';
                });
            });
        });
    });
</script>
</body>
</html>
